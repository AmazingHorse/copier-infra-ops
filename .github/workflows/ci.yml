name: Template checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out infra overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: copier-infra-ops
          fetch-depth: 0
          persist-credentials: false
      - name: Check out base underlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: AmazingHorse/copier-base
          ref: v0.1.0
          path: copier-base
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python for isolated PyPI tools
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install maintainer tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.7.18
          working_directory: copier-infra-ops
      - name: Install the combined rendered toolchain explicitly
        working-directory: copier-infra-ops
        env:
          MISE_YES: '1'
        run: |
          project="$RUNNER_TEMP/infra-toolchain"
          mise exec -- copier copy --defaults --vcs-ref HEAD \
            --answers-file .copier-answers.base.yml \
            -d project_name=ci-infra -d description='CI tool installation' \
            "$GITHUB_WORKSPACE/copier-base" "$project"
          mise exec -- copier copy --defaults --vcs-ref HEAD \
            --answers-file .copier-answers.infra-ops.yml \
            -d 'iac=[ansible, opentofu]' \
            "$GITHUB_WORKSPACE/copier-infra-ops" "$project"
          mise trust "$project/mise.toml"
          mise trust "$project/.config/mise/conf.d/infra-ops.toml"
          mise -C "$project" install
          printf 'TOOLCHAIN_PROJECT=%s\n' "$project" >> "$GITHUB_ENV"
      - name: Check all compositions offline using installed tools
        working-directory: copier-infra-ops
        env:
          BASE_TEMPLATE: ${{ github.workspace }}/copier-base
        run: |
          mise -C "$TOOLCHAIN_PROJECT" exec -- \
            mise exec -- bash "$GITHUB_WORKSPACE/copier-infra-ops/tests/render.sh"
